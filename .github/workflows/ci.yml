name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          python-version: "3.14"
      - name: Sync dependencies
        working-directory: cli
        run: uv sync
      - name: Check ruff format
        working-directory: cli
        run: uv run ruff format --check .
      - name: Run ruff lint
        working-directory: cli
        run: uv run ruff check .

  test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          python-version: "3.14"
      - name: Sync dependencies
        working-directory: cli
        run: uv sync
      - name: Run pytest
        working-directory: cli
        run: uv run pytest

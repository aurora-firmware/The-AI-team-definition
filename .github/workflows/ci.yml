name: ci

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"

jobs:
  lint:
    runs-on: [self-hosted, docker]
    container: ghcr.io/astral-sh/uv:python3.14-trixie-slim
    steps:
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git
      - uses: actions/checkout@v6
      - name: Sync dependencies
        working-directory: cli
        run: uv sync
      - name: Check ruff format
        working-directory: cli
        run: uv run ruff format --check .
      - name: Run ruff lint
        working-directory: cli
        run: uv run ruff check .
      - name: Check generated docs are up to date
        run: |
          bash cli/scripts/gen_docs.sh
          if ! git diff --exit-code cli/docs/commands.md; then
            echo "::error::cli/docs/commands.md is out of date. Run 'bash cli/scripts/gen_docs.sh' and commit the result."
            exit 1
          fi

  test:
    runs-on: [self-hosted, docker]
    container: ghcr.io/astral-sh/uv:python3.14-trixie-slim
    steps:
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git
      - uses: actions/checkout@v6
      - name: Sync dependencies
        working-directory: cli
        run: uv sync
      - name: Run pytest
        working-directory: cli
        run: uv run pytest

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [lint, test]
    runs-on: [self-hosted, docker]
    container: ghcr.io/astral-sh/uv:python3.14-trixie-slim
    permissions:
      contents: write
    steps:
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Resolve version from tag
        id: version
        run: |
          # Map `1.2.3` -> `1.2.3`, and `1.2.3-label.foo.bar` -> `1.2.3+label.foo.bar`.
          # The `+` segment is a PEP 440 local version, kept in the wheel filename.
          PEP440_VERSION="${GITHUB_REF_NAME/-/+}"
          echo "value=${PEP440_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building version: ${PEP440_VERSION}"
      - name: Build wheel and sdist
        working-directory: cli
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ steps.version.outputs.value }}
        run: uv build
      - name: Show built artifacts
        working-directory: cli
        run: ls -la dist/
      - name: Regenerate command reference
        run: bash cli/scripts/gen_docs.sh
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            cli/dist/*.whl
            cli/dist/*.tar.gz
            cli/docs/commands.md

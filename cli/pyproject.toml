[project]
name = "ai-team"
dynamic = ["version"]
description = "AI-team CLI: manage specs, tasks, bugs, and ADRs from the terminal."
requires-python = ">=3.14"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "ruamel.yaml>=0.18",
    "tomli-w>=1.0",
    "python-slugify>=8.0",
]

[project.scripts]
ai-team = "ai_team.cli:app"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options = { root = "..", tag_regex = '^(?P<version>\d+\.\d+\.\d+)(?:-.+)?$' }

[tool.hatch.build.hooks.vcs]
version-file = "src/ai_team/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_team"]

[tool.hatch.build.targets.wheel.shared-data]
# Nothing shared outside the package itself.

[tool.hatch.build.targets.wheel.force-include]
# Ensure empty placeholder directories are included in the wheel.
# Hatch ships __init__.py files; the empty dirs are created as package
# namespaces so that later tasks can drop files into them without touching
# pyproject.toml.  We track them via .gitkeep files.
"src/ai_team/templates/.gitkeep" = "ai_team/templates/.gitkeep"
"src/ai_team/init/scaffolds/.gitkeep" = "ai_team/init/scaffolds/.gitkeep"

[tool.hatch.build]
include = [
    "src/ai_team/**",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.4",
    "typer-cli>=0.24.0",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
extend-ignore = ["E501"]

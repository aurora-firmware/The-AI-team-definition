# Packaging metadata for the Claude Code and Codex plugins that
# scripts/sync_init_scaffolds.py generates under <repo>/plugins/ai-team/.

[plugin]
name = "ai-team"
description = "AI-team framework skills and agents: spec-driven planning, task and bug loops, code review, and gated integration, driven by the ai-team CLI."
author = "AI team maintainers"
homepage = "https://github.com/aurora-firmware/The-AI-team-definition"
repository = "https://github.com/aurora-firmware/The-AI-team-definition"
category = "Developer Tools"
keywords = ["ai-team", "workflow", "spec-driven", "tdd", "code-review", "agents"]

[codex.interface]
displayName = "AI Team"
shortDescription = "Spec-driven planning, task loops, review, and gated integration."
longDescription = "Use the AI team skills to brainstorm and specify work, break specs into tasks, run the development and bug-fix loops, review code, and integrate branches through quality gates. Requires the ai-team CLI."
developerName = "AI team maintainers"
capabilities = ["Interactive", "Read", "Write"]
defaultPrompt = [
  "I've got a feature I'd like to specify and build.",
  "Run the development loop on the pending tasks.",
]
